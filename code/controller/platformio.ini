; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
build_flags =
    -I"${platformio.packages_dir}/framework-arduinopico/libraries/tusb-hid/src"
lib_deps =
    adafruit/Adafruit MPR121@1.2.1
; board_build.arduino.earlephilhower.usb_vid = 0x2E8A
; board_build.arduino.earlephilhower.usb_pid = 0x000A
; board_build.arduino.earlephilhower.usb_manufacturer = Jibhong
; board_build.arduino.earlephilhower.usb_product = ChuniSliderPico